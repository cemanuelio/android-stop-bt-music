name: Build

on:
  # Build roda só ao empurrar uma tag v*; workflow_dispatch serve de
  # gatilho manual de teste (o step de release fica inativo sem tag).
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A imagem do runner não garante sdkmanager no PATH; instalamos os
      # command-line tools num diretório próprio. Caminho absoluto fixo
      # (variáveis em env: não passam por expansão de shell) e os dois
      # nomes com o MESMO valor, senão o AGP aborta (a imagem já define
      # ANDROID_SDK_ROOT apontando pro SDK pré-instalado dela).
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/clt.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip"
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stopbl-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Criar release com APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
