name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner já vem com o SDK do Android; instalamos o que falta
      # (platform 36 não é garantido na imagem) e aceitamos licenças
      # para o AGP poder baixar o que faltar.
      - name: Setup Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          yes | sdkmanager --licenses > /dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stopbl-debug
          path: app/build/outputs/apk/debug/app-debug.apk
